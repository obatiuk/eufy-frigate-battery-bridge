# yaml-language-server: $schema=https://raw.githubusercontent.com/obatiuk/eufy-frigate-battery-bridge/main/deploy/config.schema.json

# Stream output dimensions, frame rates, and audio
width: 1280
height: 720
live_fps: 15
idle_fps: 5
audio: true

# Status card and sleeping screen defaults
card_theme: minimal
card_position: bottom-left
sleep_screen: snapshot
card_show_on_live: true
auto_frigate_mask: true
preserve_aspect_ratio: true
startup_snapshot: true
instant_event_snapshot: true
snapshot_capture_delay_secs: 3

# Recording timers and Live View arbitration defaults
hold_secs: 60
stream_max_secs: 900
frigate_event_secs: 60
end_early: false
idle_timeout_secs: 0
view_linger_secs: 20
view_max_secs: 300
view_cooldown_secs: 5
view_has_priority: true

# Transport, backfill, Power Manager, and battery defaults
use_rtsp: true
backfill_enabled: true
backfill_delay_secs: 2
sync_power: true
track_stuck_spotlight: false
enforce_streaming_quality: true
low_battery_threshold: 30
critical_battery_threshold: 5
low_battery_hold_secs: 20
low_battery_wake_on_view: false
telemetry_poll_secs: 300
telemetry:
  enabled: true
  battery: true
  power_source: true
  wifi: true
  rssi: true
  temperature: false
  last_seen: false

# Event triggers, priorities, and HomeBase 3 face forwarding
forward_face_names: true
ring_label: person
trigger_events:
  - motion
  - radar
  - person
  - identity person
  - stranger
  - loitering
  - package
  - pet
  - dog
  - vehicle
  - sound
  - crying
  - ring
event_priorities:
  ring: 1000
  identity person: 300
  person: 200
  stranger: 200
  loitering: 200
  package: 150
  vehicle: 100
  pet: 100
  dog: 100
  crying: 50
  sound: 50
  radar: 10
  motion: 10

cameras:
  - name: storage
    title: Storage Room Camera
    serial: SN0000000001
    mode: rtsp
    priority: 50

  - name: front_doorbell
    title: Front Doorbell
    serial: SN0000000002
    mode: backfill
    hold_secs: 30
    frigate_event_secs: 30
    end_early: true
    trigger_events:
      - person
      - package
      - ring
    priority: 100

  - name: garage
    title: Garage Camera
    serial: SN0000000003
    station_serial: SN0000000000
    mode: custom
    use_rtsp: true
    backfill_only: false
    backfill_enabled: true
    hold_secs: 60
    stream_max_secs: 900
    frigate_event_secs: 45
    end_early: false
    idle_timeout_secs: 15
    view_linger_secs: 20
    view_max_secs: 300
    low_battery_threshold: 30
    critical_battery_threshold: 5
    low_battery_hold_secs: 20
    low_battery_wake_on_view: false
    sync_power: true
    track_stuck_spotlight: false
    power_working_mode: 2
    recording_clip_length: 60
    recording_end_early: false
    recording_retrigger_interval: 5
    enforce_streaming_quality: true
    trigger_events:
      - motion
      - person
      - vehicle
    card_theme: pebbles
    card_position: bottom-left
    sleep_screen: snapshot
    card_show_on_live: true
    auto_frigate_mask: true
    preserve_aspect_ratio: true
    startup_snapshot: true
    telemetry:
      enabled: true
      battery: true
      power_source: true
      wifi: true
      rssi: true
      temperature: true
      last_seen: true
    priority: 50

  - name: baby_room
    title: Baby Monitor Camera
    mode: rtsp
    rtsp_url: rtsp://${RTSP_USER}:${RTSP_PASSWORD}@192.0.2.20:554/live0
